name: ShelfCheck Art Department Audit
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of suspect covers to query against GameEye'
        required: false
        default: '1000'
  push:
    branches:
      - art-department-retail-covers
    paths:
      - '.github/workflows/art-department-audit.yml'
      - 'tools/art-department-audit.mjs'
      - 'tools/promote-gameye-retail.mjs'
      - 'covers-manifest.js'
      - 'cover-overrides.js'
      - 'cover-title-overrides.js'
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art-department-retail-covers
      - name: Run Art Department source audit
        env:
          ART_AUDIT_LIMIT: ${{ github.event.inputs.limit || '1000' }}
        run: node tools/art-department-audit.mjs
      - name: Verify and promote safe GameEye retail fronts
        run: node tools/promote-gameye-retail.mjs
      - name: Commit audit and generated retail layer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-out/art-department-audit.json audit-out/art-department-audit.md audit-out/art-department-gameye-promotions.json cover-gameye-retail.js
          if ! git diff --cached --quiet; then
            git commit -m "Update Art Department cover audit and retail fronts"
            git push origin HEAD:art-department-retail-covers
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shelfcheck-art-department-audit
          path: |
            audit-out/art-department-audit.json
            audit-out/art-department-audit.md
            audit-out/art-department-gameye-promotions.json
            cover-gameye-retail.js
