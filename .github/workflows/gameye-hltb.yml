name: GAMEYE HLTB Bridge
on:
  push:
    paths:
      - 'tools/gameye-full-fetch.mjs'
      - 'tools/gameye-known-ps4-probe.mjs'
      - 'tools/gameye-hltb-import.mjs'
      - '.github/workflows/gameye-hltb.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Probe known PS4 records
        run: node tools/gameye-known-ps4-probe.mjs
      - name: Harvest verified GAMEYE PS4 HLTB
        run: node tools/gameye-full-fetch.mjs
      - name: Build canonical snapshot
        run: node tools/price-gap-audit.mjs
      - name: Reconcile GAMEYE HLTB
        run: node tools/gameye-hltb-import.mjs gameye-hltb.json audit-out/canonical-live.json hltb-gameye-v067.js audit-out/gameye-hltb-review.json
      - name: Sanity gate accepted bridge
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('audit-out/gameye-hltb-accepted.json','utf8'));
          const n=Array.isArray(a)?a.length:(a.accepted||[]).length;
          console.log('accepted canonical HLTB matches:',n);
          if(n<100) throw new Error('Refusing publish: accepted canonical HLTB matches < 100');
          NODE
      - name: Publish full HLTB bridge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gameye-hltb.json hltb-gameye-v067.js audit-out/gameye-hltb-accepted.json audit-out/gameye-hltb-review.json audit-out/gameye-full-fetch-report.json audit-out/gameye-known-ps4-probe.json
          git diff --cached --quiet || git commit -m "Update full GAMEYE HLTB bridge"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameye-hltb-full
          path: |
            audit-out/gameye-hltb-accepted.json
            audit-out/gameye-hltb-review.json
            audit-out/gameye-full-fetch-report.json
            audit-out/gameye-known-ps4-probe.json
