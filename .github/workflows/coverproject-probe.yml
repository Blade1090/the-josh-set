name: ShelfCheck PriceCharting Cover Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/coverproject-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe PriceCharting cover markup
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, re, html
          UA='Mozilla/5.0 ShelfCheck cover research'
          urls=[
            'https://www.pricecharting.com/console/pal-playstation-4?sort=name&view=grid',
            'https://www.pricecharting.com/search-products?type=prices&q=112th%20Seed%20Playstation%204',
            'https://www.pricecharting.com/search-products?type=prices&q=A%20Plague%20Tale%20Innocence%20Playstation%204'
          ]
          for u in urls:
              print('\nURL',u)
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':UA})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(5_000_000); text=raw.decode('utf-8','ignore')
                      print('STATUS',r.status,'FINAL',r.geturl(),'BYTES',len(raw))
                      for needle in ['112th Seed','A Plague Tale']:
                          p=text.lower().find(needle.lower())
                          if p>=0:
                              snip=text[max(0,p-2500):p+3500]
                              print('AROUND',needle,re.sub(r'\s+',' ',snip))
                      imgs=[]
                      for m in re.finditer(r'<img\b[^>]*>',text,re.I):
                          tag=m.group(0)
                          if any(x in tag.lower() for x in ['112th','plague','product_image','product-image','cover']): imgs.append(tag)
                      print('MATCHING IMG TAGS',imgs[:20])
                      image_urls=re.findall(r'(?:src|data-src|data-original)=["\']([^"\']+)["\']',text,re.I)
                      print('IMAGE URL SAMPLES',[html.unescape(x) for x in image_urls if 'image' in x.lower() or 'storage' in x.lower()][:40])
              except Exception as e:
                  print(type(e).__name__,repr(e))
          PY
