name: Deploy Josh Set
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build ShelfCheck Cover Manifest"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # A cover-manifest run on a feature branch must never publish that branch's SHA to Pages.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # After a cover-manifest run, deploy main's tip: the bot's manifest commit is newer than the
          # run's head_sha, and pushes made with GITHUB_TOKEN do not trigger this workflow themselves.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
