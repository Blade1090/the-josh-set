name: Price Gap Audit
on:
  push:
    paths:
      - 'tools/price-gap-audit.mjs'
      - 'tools/price-gap-post-v050.mjs'
      - 'tools/build-public-price-profile.mjs'
      - 'price-online-v041.js'
      - 'price-negative-space-v042.js'
      - 'price-direct-v050.js'
      - 'price-direct-v051.js'
      - 'data*.txt'
      - 'census-*.js'
      - '.github/workflows/price-gap-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/price-gap-audit.mjs
      - run: node tools/price-gap-post-v050.mjs
      - run: node tools/build-public-price-profile.mjs
      - name: Publish public price profile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-prices-full-v066.js
          git diff --cached --quiet || git commit -m "Update full public price profile"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: shelfcheck-price-gap
          path: audit-out/
