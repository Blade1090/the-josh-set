name: ShelfCheck Cover Visual Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cover-source-audit.mjs'
      - 'tools/cover-visual-audit.py'
      - 'cover-gameye-retail.js'
      - 'cover-title-overrides.js'
      - 'cover-overrides.js'
      - 'covers-manifest.js'
      - '.github/workflows/cover-visual-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build source audit
        run: node tools/cover-source-audit.mjs
      - name: Run visual audit
        run: python tools/cover-visual-audit.py
      - name: Show summary
        run: |
          python - <<'PY'
          import json
          with open('audit-out/cover-visual-audit.json', encoding='utf-8') as f:
              print(json.dumps(json.load(f)['summary'], indent=2))
          PY
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: shelfcheck-cover-audit
          path: |
            audit-out/cover-source-audit.json
            audit-out/cover-visual-audit.json
            audit-out/cover-review-queue.csv
