name: ShelfCheck Cover Visual Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cover-source-audit.mjs'
      - 'tools/cover-visual-audit.py'
      - 'audit-out/cover-manual-qa.json'
      - 'cover-gameye-retail.js'
      - 'cover-title-overrides.js'
      - 'cover-overrides.js'
      - 'covers-manifest.js'
      - '.github/workflows/cover-visual-audit.yml'

permissions:
  contents: write

concurrency:
  group: cover-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build source audit
        run: node tools/cover-source-audit.mjs
      - name: Run visual audit
        env:
          COVER_AUDIT_WORKERS: '16'
        run: python tools/cover-visual-audit.py
      - name: Show summary
        run: |
          python - <<'PY'
          import json
          with open('audit-out/cover-visual-audit.json', encoding='utf-8') as f:
              print(json.dumps(json.load(f)['summary'], indent=2))
          PY
      - name: Publish runtime quality gate to branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- audit-out/cover-runtime-qa.json; then
            echo "Runtime gate unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp audit-out/cover-runtime-qa.json /tmp/cover-runtime-qa.json
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp /tmp/cover-runtime-qa.json audit-out/cover-runtime-qa.json
          git add audit-out/cover-runtime-qa.json
          git commit -m "Art Department: refresh runtime cover quality gate"
          git push origin HEAD:"$BRANCH"
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: shelfcheck-cover-audit
          path: |
            audit-out/cover-source-audit.json
            audit-out/cover-visual-audit.json
            audit-out/cover-runtime-qa.json
            audit-out/cover-review-queue.csv
